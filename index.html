<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TEMPEST V109 DOMINATOR</title>
<link rel="manifest" href="manifest.json"/>
<style>
body{margin:0;background:#000;color:#0f0;font-family:monospace}
.header{background:#111;padding:12px;text-align:center;border-bottom:2px solid #0f0}
.switch{display:flex;gap:8px;justify-content:center;margin:10px}
.btn{padding:10px 18px;border:1px solid #0f0;background:#000;color:#0f0;border-radius:8px;font-weight:bold}
.btn.active{background:#0f0;color:#000}
#tv{height:380px;background:#0a0a0a}
.card{margin:12px;padding:12px;border:1px solid #0f0;border-radius:10px;background:#111}
.price{font-size:22px;color:#ff0}
</style>
</head>
<body>
<div class="header">🌪️ TEMPEST V109 DOMINATOR - HYBRID</div>

<div class="switch">
<button class="btn active" id="bPhone" onclick="setMode('phone')">📱 PHONE</button>
<button class="btn" id="bPc" onclick="setMode('pc')">💻 PC</button>
</div>
<div class="switch">
<button class="btn active" id="bDeriv" onclick="setBroker('deriv')">🔥 DERIV</button>
<button class="btn" id="bEx" onclick="setBroker('exness')">📈 EXNESS MT5</button>
</div>

<div id="tv"></div>

<div class="card">
<div id="quote">"Buffett: 1% risk - Titans never blow accounts"</div>
<div class="price" id="price">XAUUSD: Loading...</div>
<div>Mode: <span id="modeTxt">PHONE + DERIV</span></div>
<div>Signal: <span id="sig">WAIT</span></div>
<button class="btn" style="width:100%;margin-top:10px;background:#0f0;color:#000" onclick="start()">🚀 START SOLO</button>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let mode='phone', broker='deriv';
let quotes=["Buffett: 1% risk - Titans never blow accounts","Soros: See the bubble, bet big","Dalio: Diversify, then dominate","Lynch: Know what you own","Templeton: Buy at maximum pessimism"];
let qi=0;
setInterval(()=>{document.getElementById('quote').innerText='"'+quotes[qi%quotes.length]+'"';qi++;},3000);

function setMode(m){mode=m;document.getElementById('bPhone').classList.toggle('active',m=='phone');document.getElementById('bPc').classList.toggle('active',m=='pc');upd()}
function setBroker(b){broker=b;document.getElementById('bDeriv').classList.toggle('active',b=='deriv');document.getElementById('bEx').classList.toggle('active',b=='exness');upd()}
function upd(){document.getElementById('modeTxt').innerText=(mode=='phone'?'📱 PHONE':'💻 PC')+' + '+(broker=='deriv'?'🔥 DERIV':'📈 EXNESS')}

new TradingView.widget({autosize:true,symbol:"OANDA:XAUUSD",interval:"5",timezone:"Africa/Kampala",theme:"dark",style:"1",container_id:"tv"});

async function fetchPrice(){try{let r=await fetch('/api/status');let j=await r.json();document.getElementById('price').innerText='XAUUSD: $'+(j.price||'---');document.getElementById('sig').innerText=j.action||'WAIT';}catch(e){} } setInterval(fetchPrice,3000);

async function start(){
let sig={action:Math.random()>0.5?'BUY':'SELL',symbol:'XAUUSD',lot:0.01,broker:broker,source:mode};
if(mode=='pc'){await fetch('/api/signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sig)});alert('Signal sent to PC! '+sig.action+' - Run bridge on PC');}
else{await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sig)});alert('PHONE DERIV Trade: '+sig.action);}
}
upd();
</script>
</body>
</html>
